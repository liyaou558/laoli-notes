<style>
:root{
  --bg:#f6f1e6;
  --bg-2:#eee5d3;
  --ink:#2a2420;
  --ink-2:#6f6456;
  --ink-3:#9a8f7e;
  --red:#a63a2e;
  --red-deep:#7c2a22;
  --gold:#b98a2e;
  --green:#3d7a4f;
  --blue:#2f6ba6;
  --card:#fffdf7;
  --line:#e2d7c2;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.8;
  font-size:16px;
  overflow-wrap:break-word;
}
.serif{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;}
.wrap{max-width:880px;margin:0 auto;padding:44px 22px 90px;overflow:hidden;min-width:0;}

/* ===== 卷首 ===== */
.masthead{text-align:center;padding:26px 0 30px;border-bottom:1px solid var(--line);margin-bottom:34px;}
.seal{
  display:inline-block;width:52px;height:52px;line-height:52px;text-align:center;
  background:var(--red-deep);color:#f6f1e6;border-radius:6px;font-size:20px;font-weight:700;
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;letter-spacing:0;margin-bottom:14px;
}
.masthead h1{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;font-size:25px;font-weight:700;color:var(--red-deep);letter-spacing:1px;line-height:1.5;}
.masthead .sub2{color:var(--ink-2);font-size:14px;margin-top:6px;}
.masthead .sub{color:var(--ink-2);font-size:14px;margin-top:10px;letter-spacing:1px;}
.masthead .sub b{color:var(--gold);font-weight:600;}

/* ===== 板块通用 ===== */
.section{margin-top:46px;}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.sec-no{font-family:"Noto Serif SC","Songti SC","SimSun",serif;color:var(--red);font-size:22px;font-weight:700;line-height:1;}
.sec-title{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:1px;}
.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--line),transparent);min-width:0;}

/* ===== 档案表 ===== */
table.dossier{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px;}
table.dossier th,table.dossier td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);}
table.dossier tr:last-child th,table.dossier tr:last-child td{border-bottom:none;}
table.dossier th{width:108px;color:var(--red-deep);font-weight:600;white-space:nowrap;background:var(--bg-2);}
table.dossier td{color:var(--ink);overflow-wrap:break-word;min-width:0;}
@media(max-width:560px){table.dossier th{width:76px;}table.dossier th,table.dossier td{padding:10px 10px;}}

/* ===== 时间线 ===== */
.timeline{position:relative;margin:6px 0 0 4px;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 22px 0;min-width:0;}
.tl-item:last-child{padding-bottom:4px;}
.tl-item::before{content:"";position:absolute;left:-25px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--bg);}
.tl-item.gold::before{background:var(--gold);}
.tl-item.blue::before{background:var(--blue);}
.tl-item.green::before{background:var(--green);}
.tl-date{font-weight:700;color:var(--red-deep);font-size:14px;letter-spacing:.5px;}
.tl-item.gold .tl-date{color:var(--gold);}
.tl-item.blue .tl-date{color:var(--blue);}
.tl-item.green .tl-date{color:var(--green);}
.tl-body{color:var(--ink);font-size:14px;margin-top:3px;line-height:1.9;padding-right:8px;}
.tl-body .note{color:var(--ink-2);font-size:13px;}

/* ===== 一句话论点 ===== */
.thesis{background:var(--bg-2);border-left:4px solid var(--red);padding:18px 20px;font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:18px;color:var(--ink);line-height:1.9;border-radius:0 6px 6px 0;}
.thesis .q{color:var(--red-deep);font-weight:700;}

/* ===== 要点卡 ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px;}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);padding:16px 18px;border-radius:6px;min-width:0;overflow:hidden;}
.card h4{font-size:15px;color:var(--red-deep);margin-bottom:8px;font-weight:700;line-height:1.6;}
.card p{font-size:14px;color:var(--ink-2);line-height:1.7;}
.card ul{list-style:none;margin-top:6px;}
.card li{position:relative;padding-left:16px;font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-top:4px;min-width:0;overflow-wrap:break-word;}
.card li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line);}
.card li b{color:var(--ink);}
.card.gold{border-top-color:var(--gold);}
.card.green{border-top-color:var(--green);}
.card.blue{border-top-color:var(--blue);}
.card.gold h4{color:var(--gold);}
.card.green h4{color:var(--green);}
.card.blue h4{color:var(--blue);}
.card .card-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;background:var(--bg-2);color:var(--ink-2);margin-left:6px;vertical-align:2px;font-weight:400;letter-spacing:0;}

/* ===== 链条图 ===== */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:6px;}
.node{flex:1 1 150px;min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 12px;text-align:center;}
.node .n-label{font-size:15px;font-weight:700;color:var(--red-deep);}
.node.gold .n-label{color:var(--gold);}
.node.green .n-label{color:var(--green);}
.node.blue .n-label{color:var(--blue);}
.node .n-sub{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.6;}
.arrow{align-self:center;color:var(--gold);font-size:18px;flex:0 0 auto;padding:0 2px;font-family:serif;}
@media(max-width:640px){.chain{flex-direction:column;}.arrow{transform:rotate(90deg);align-self:center;}}

/* ===== 光谱图 ===== */
.spectrum{margin-top:22px;}
.spec-frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);}
.spec-band,.spec-labels{display:grid;grid-template-columns:repeat(3,1fr);}
.spec-band{overflow:hidden;}
.spec-seg{min-width:0;overflow:hidden;color:#fff;text-align:center;white-space:nowrap;padding:13px 3px;font-weight:700;font-size:12px;letter-spacing:1px;}
.spec-seg.green{background:var(--green);}
.spec-seg.red{background:var(--red-deep);}
.spec-seg.gold{background:var(--gold);}
.spec-seg.blue{background:var(--blue);}
.spec-labels{border-top:1px solid var(--line);overflow:hidden;background:var(--card);}
.spec-label{min-width:0;overflow-wrap:break-word;text-align:center;font-size:12.5px;color:var(--ink-2);padding:9px 5px;line-height:1.55;}
.spec-label + .spec-label{border-left:1px solid var(--line);}
.spec-label b{display:block;color:var(--ink);font-size:13px;}
@media(max-width:560px){
  .spec-seg{font-size:10px;padding:11px 2px;letter-spacing:0;}
  .spec-label{font-size:11px;padding:8px 3px;}
  .spec-label b{font-size:11px;}
}
@media(max-width:360px){
  .spec-seg{font-size:9.5px;}
  .spec-label{font-size:10px;}
  .spec-label b{font-size:10px;}
}

/* ===== 结构块 ===== */
.part{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;margin-top:14px;min-width:0;}
.part-head{display:flex;align-items:baseline;gap:10px;padding:12px 16px;flex-wrap:wrap;}
.part-head.red{background:var(--bg-2);}
.part-no{font-family:"Noto Serif SC","Songti SC",serif;font-size:17px;font-weight:700;color:var(--red-deep);}
.part-title{font-family:"Noto Serif SC","Songti SC",serif;font-size:18px;font-weight:700;color:var(--red-deep);letter-spacing:.5px;}
.part-scope{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;}
.part-head.gold{background:var(--bg-2);}
.part-head.gold .part-no,.part-head.gold .part-title{color:var(--gold);}
.part-head.blue{background:var(--bg-2);}
.part-head.blue .part-no,.part-head.blue .part-title{color:var(--blue);}
.part-head.green{background:var(--bg-2);}
.part-head.green .part-no,.part-head.green .part-title{color:var(--green);}
.part-body{padding:12px 16px 14px;font-size:14px;color:var(--ink-2);line-height:1.85;}
.part-body p + p{margin-top:6px;}
.part-body ul{list-style:none;margin-top:2px;}
.part-body li{position:relative;padding-left:18px;padding-right:8px;min-width:0;overflow-wrap:break-word;}
.part-body li::before{content:"";position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--line);}
.part-body li b{color:var(--ink);}
.part-body .k{color:var(--red-deep);font-weight:600;}

/* ===== 小网格 ===== */
.grid18{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px;min-width:0;}
.g18{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:12.5px;color:var(--ink-2);line-height:1.6;min-width:0;overflow:hidden;overflow-wrap:anywhere;}
.g18 b{color:var(--red-deep);font-family:"Noto Serif SC","Songti SC",serif;margin-right:5px;}
.g18.on{background:var(--bg-2);border-color:var(--red);}
.g18.on b{color:var(--red);}
.g18.now{border-color:var(--gold);}
.g18.now b{color:var(--gold);}

/* ===== 方针卡 ===== */
.move-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px;min-width:0;}
.move{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:0 6px 6px 0;padding:12px 14px 13px;min-width:0;overflow:hidden;}
.move-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.move-no{font-family:"Noto Serif SC","Songti SC",serif;font-size:15px;font-weight:700;color:var(--red);flex:0 0 auto;}
.move-tag{font-size:11px;padding:1px 7px;border-radius:3px;background:var(--bg-2);color:var(--ink-2);letter-spacing:0;}
.move-text{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:14px;color:var(--ink);line-height:1.8;min-width:0;}
.move-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);}
.move.gold{border-left-color:var(--gold);}
.move.gold .move-no{color:var(--gold);}
.move.blue{border-left-color:var(--blue);}
.move.blue .move-no{color:var(--blue);}
.move.green{border-left-color:var(--green);}
.move.green .move-no{color:var(--green);}
@media(max-width:420px){.move{padding:11px 12px 12px;}.move-text{font-size:13.5px;}}

/* ===== 通用表 ===== */
table.plain{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13.5px;margin-top:12px;}
table.plain th,table.plain td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere;min-width:0;}
table.plain tr:last-child th,table.plain tr:last-child td{border-bottom:none;}
table.plain thead th{background:var(--bg-2);color:var(--red-deep);font-weight:700;white-space:normal;}
table.plain td b{color:var(--ink);}
table.plain .c1{width:76px;color:var(--red-deep);font-weight:600;white-space:nowrap;}
@media(max-width:560px){table.plain{font-size:12.5px;}table.plain th,table.plain td{padding:9px 9px;}table.plain .c1{width:56px;}}

/* ===== 结论引用块 ===== */
.quote{border-left:4px solid var(--red);background:var(--card);padding:18px 22px;margin-top:18px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;font-size:16px;line-height:2;color:var(--ink);border-radius:0 6px 6px 0;}
.quote .src{display:block;margin-top:10px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:var(--ink-3);}

/* ===== 观察 ===== */
.obs{margin-top:8px;}
.obs-item{display:flex;gap:14px;padding:18px 0;border-bottom:1px dashed var(--line);min-width:0;}
.obs-item:last-child{border-bottom:none;}
.obs-num{flex:0 0 30px;height:30px;line-height:30px;text-align:center;background:var(--bg-2);color:var(--red-deep);font-weight:700;border-radius:50%;font-size:14px;font-family:serif;}
.obs-body{flex:1;min-width:0;}
.obs-body h4{font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:700;line-height:1.6;}
.obs-body p{font-size:14px;color:var(--ink-2);line-height:1.8;}
.obs-body p + p{margin-top:6px;}
.obs-body .mv{display:block;margin-top:7px;padding-left:12px;border-left:2px solid var(--line);font-size:13.5px;color:var(--ink-2);}

/* ===== 金句 ===== */
.golden{margin-top:6px;}
.golden-item{padding:16px 0;border-bottom:1px solid var(--line);min-width:0;}
.golden-item:last-child{border-bottom:none;}
.golden-item .text{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;font-size:17px;line-height:2;color:var(--ink);}
.golden-item .text::before{content:"「";color:var(--red);}
.golden-item .text::after{content:"」";color:var(--red);}
.golden-item .ctx{font-size:12.5px;color:var(--ink-3);margin-top:8px;}

/* ===== 延伸阅读 ===== */
.next{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
.next-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0;overflow:hidden;}
.next-card h4{font-size:14px;color:var(--gold);margin-bottom:8px;font-weight:700;letter-spacing:1px;}
.next-card .t{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:17px;color:var(--ink);font-weight:700;line-height:1.6;}
.next-card p{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.75;}
@media(max-width:640px){.next{grid-template-columns:1fr;}}

/* ===== 思考题 ===== */
.think{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0;}
.think h4{color:var(--red-deep);font-size:16px;margin-bottom:12px;}
.think .q{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:16px;color:var(--ink);line-height:2;}
.think .q + .q{margin-top:10px;}
.think .hint{font-size:13px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.8;}

/* ===== 页脚 ===== */
.footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--ink-3);font-size:12.5px;line-height:2;}
.footer .wm{letter-spacing:1px;}

.lead{color:var(--ink-2);font-size:15px;line-height:1.9;}
.lead b{color:var(--ink);}
.muted{color:var(--ink-3);}

/* ===== 窄列 CJK 断行兜底 ===== */
b,strong,i,em,span,h1,h2,h3,h4,h5,h6,li,td,th,p,.tl-date,.tl-body,.spec-label,.golden-item .text,.quote,.next-card p,.obs-body p,.card p,.card li,.part-body li,.n-sub,.move-text,.move-note,.g18{overflow-wrap:anywhere;word-break:break-word;}
.tl-date{white-space:normal;}
<body>
<div class="wrap">

  <!-- 卷首 -->
  <header class="masthead">
    <div class="seal">卅五</div>
    <h1>关于国际新形势对新华日报记者的谈话</h1>
    <div class="sub2">先纠正一个因果，再宣布一次阶段交接</div>
    <div class="sub">毛泽东选集 · 第二卷 · 第十七篇 · <b>一九三九年九月一日</b></div>
  </header>

  <!-- 1 篇章档案 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">壹</span><span class="sec-title">篇章档案</span></div>
    <table class="dossier">
      <tr><th>篇名</th><td>《关于国际新形势对新华日报记者的谈话》。1991 年版第二卷第十七篇，上接《必须制裁反动派》（8.01），下接《和中央社、扫荡报、新民报三记者的谈话》（9.16）——<b>三篇排在一起，正好是一个月的三种讲法</b>：会场上的演说、党报面前的国际分析、国统区记者面前的国内答问</td></tr>
      <tr><th>写作时间</th><td>题下署<b>一九三九年九月一日</b>。这是<b>答问记录</b>，不是撰文：全篇四问四答，提问者留下的是问题而不留姓名，答者保留口语的连词与重复</td></tr>
      <tr><th>最初发表</th><td>延安《新中华报》（中共中央机关报，1939 年 2 月 7 日改组后出版）。<b>确切刊期此处不写死</b>：可确证的下限来自下一篇正文——九月十六日中央社、扫荡报、新民报三记者见到毛泽东时说的第一句话是「今天在《新中华报》上看了毛先生九月一日的谈话」，即 9.16 之前已在延安刊出，且<b>先于重庆《新华日报》</b></td></tr>
      <tr><th>收录版本</th><td>《毛泽东选集》第二卷（人民出版社 1952 年第一版；本册依据 1991 年第二版），第二版第 <b>580—586</b> 页，共七页；注释九条：〔1〕《新华日报》〔2〕苏德条约签订日〔3〕张伯伦与达拉第〔4〕「不干涉」政策下被牺牲的国家清单〔5〕《防共协定》〔6〕慕尼黑协定〔7〕以华制华〔8〕以战养战〔9〕扫荡</td></tr>
      <tr><th>题解</th><td><b>本篇无题解</b>——1991 年版第 580 页正文前直接是标题与日期，没有「这是……」的说明句。谈话体在本卷多数不加题解，读者须自己从第一问的第一句判断场合与对象</td></tr>
      <tr><th>篇幅</th><td>四问四答，汉字 <b>2916</b> 字（不含标点与注释）。四块：<b>205／694／1242／775</b>——第三块（「目前的时局将要如何发展」）一块占全篇四成三，是全篇的承重墙；第一块最短，只回答「这个协定是什么意思」</td></tr>
      <tr><th>注释的后设性</th><td>注〔3〕写「一九三九年九月，德国法西斯首先向英法和它们的同盟国发动了战争」——<b>这条注释写于 1952 年</b>；正文里当时只有「是迫在眉睫了」。读本篇要分清两层声音：1939 年 9 月 1 日的判断，与 1952 年补的结局</td></tr>
      <tr><th>历史坐标</th><td>谈话署日正是<b>德国入侵波兰的当天</b>（柏林时间 9 月 1 日 4:45 炮击西盘半岛，折北京时间约 10:45）；三天后英法对德宣战；十七天后苏军从东面进入波兰；二十七天后华沙投降、德苏按秘密议定书瓜分波兰。<b>这一篇写在「即将」与「已经」之间</b></td></tr>
    </table>
  </section>

  <!-- 2 写作背景 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">贰</span><span class="sec-title">写作背景</span></div>

    <div class="part">
      <div class="part-head red"><span class="part-no">一</span><span class="part-title">谈话那一天，欧洲的战争已经在几小时前开打</span><span class="part-scope">1939.09.01</span></div>
      <div class="part-body">
        <p>一九三九年九月一日凌晨四时四十五分，德国战列舰「石勒苏益格—荷尔斯泰因」号炮击但泽港内的西盘半岛，六十二个师、一千三百架飞机随后越过波德边境。这个时刻折算到延安，是<b>同一天的上午十点四十五分左右</b>。</p>
        <p><b>但全篇用的全是将来时</b>：「德意帝国主义集团和英法帝国主义集团之间……是迫在眉睫了」，「往后的时间，就不得不变成英法和德意两大帝国主义集团直接冲突的局面」。一篇署日在开战当天的谈话，通篇把战争说成「即将发生」——这中间可能隔着电讯抵达的时间，也可能只是文本保住了谈话当时的口气；<b>无论如何，本篇的「国际新形势」是在战争的门口、用战争尚未开始的语法写下的</b>。这一点决定了全篇的性质：它不是战报分析，是<b>开战前的最后一次估算</b>。</p>
        <p>值得一并记住的是那份「事后补的结局」：注〔3〕说德军「首先向英法和它们的同盟国发动了战争」，这条注释写在十三年之后，那时波兰早已不存在、法国已经投降又复国、苏德条约早在 1941 年 6 月被撕毁。<b>同一页纸上，1939 年的「迫在眉睫」和 1952 年的「已经发生」并排放着</b>——这是选集本常见的层次，也是读本篇最容易滑过去的一处。</p>
      </div>
    </div>

    <div class="part">
      <div class="part-head gold"><span class="part-no">二</span><span class="part-title">八天前的那份协定：为什么它需要一篇专门的解释</span><span class="part-scope">1939.08.23</span></div>
      <div class="part-body">
        <p>八月二十三日，莫洛托夫与里宾特洛甫在莫斯科签字，《苏德互不侵犯条约》有效期十年，另有划定东欧势力范围的秘密议定书。消息传出，全世界的共产党组织都被追问同一个问题：<b>反共协定的一方，怎么和反共集团的首脑签了互不侵犯？</b></p>
        <p>本篇第一段就是答案，而且答得极简：这是「苏联社会主义力量增长和苏联政府坚持和平政策的结果」，它「打破了张伯伦、达拉第等国际反动资产阶级挑动苏德战争的阴谋，打破了德意日反共集团对于苏联的包围」——在东方「打击了日本，援助了中国」。</p>
        <p><b>注意这个答案的落点：它不谈条约本身，只谈条约的对手是谁。</b>解释的重心从「苏联做了什么」转到「谁最不高兴」，这是本篇全部论证的起点，也是它此后七十年里最受争议的地方。秘密议定书当时无人知晓；战后公布，苏联长期否认，直到 1989—1990 年才正式承认其存在。<b>1939 年 9 月的延安，面对的是一份公开的七条正文，不是后来的完整档案。</b></p>
      </div>
    </div>

    <div class="part">
      <div class="part-head blue"><span class="part-no">三</span><span class="part-title">四个多月的谈判，卡在一条「过境权」上</span><span class="part-scope">1939.04.15 — 08.23</span></div>
      <div class="part-body">
        <p>第二问是全篇最「技术」的一段，也是最能看出谈话者读过材料的一段。英法苏三国谈判从四月十五日谈到八月二十三日，谈了四个多月，破裂的三个具体症结被逐条列出：</p>
        <ul>
          <li><b>平等互惠</b>：英法「只要求苏联保证它们的安全，它们却不肯保证苏联的安全」。</li>
          <li><b>波罗的海</b>：不肯保证「波罗的海诸小国的安全，以便开一个缺口让德国进兵」。</li>
          <li><b>过境权</b>：「不让苏联军队通过波兰去反对侵略者」——这一条最要命，因为不经波兰，苏军无法接触德军。</li>
        </ul>
        <p>结论一句不留余地：「英法苏三国谈判所以没有成功，完全由于英法政府没有诚意。」<b>这与当时英法方面的说法正好相反</b>——伦敦的口径是「苏德条约毁了三国谈判」。本篇第二问开头那句就是冲着这个口径去的：「人们还不明了苏德互不侵犯协定是英法苏谈判破裂的结果，反而以为英法苏谈判的破裂是苏德协定的结果。」<b>全篇的第一个动作不是预测，是纠正因果的方向。</b></p>
      </div>
    </div>

    <div class="part">
      <div class="part-head green"><span class="part-no">四</span><span class="part-title">「不干涉」的账本：从半个中国到整个捷克</span><span class="part-scope">1935 — 1939</span></div>
      <div class="part-body">
        <p>第二问里有一份清单，把四年间的失地按顺序摆开：「曾经牺牲了半个中国给日本，牺牲了整个阿比西尼亚、整个西班牙、整个奥国、整个捷克给德意。」注〔4〕把这份清单落到日期上：</p>
        <ul>
          <li><b>1935.10 — 1936.5</b>　意大利侵略并占领阿比西尼亚（埃塞俄比亚）。</li>
          <li><b>1936.7 — 1939.3</b>　德意武装干涉西班牙，支持佛朗哥叛军，人民阵线政府苦战两年多后失败。</li>
          <li><b>1938.3</b>　德国出兵占领奥地利。</li>
          <li><b>1938.10</b>　德军进入捷克斯洛伐克苏台德区（《慕尼黑协定》后）。</li>
          <li><b>1939.3</b>　德国完全占领捷克斯洛伐克——慕尼黑协定签字不到半年即被撕毁。</li>
        </ul>
        <p>这份清单的用法是<b>把「不干涉」从一种外交辞令算成一笔账</b>：每一次「不干涉」都对应一个具体国家的消失，而账本的下一行写着苏联。于是「坐山观虎斗」不再是比喻，而是一个可以逐年核对的行为模式：「它从张伯伦上台开始，到去年九月慕尼黑协定发展到了顶点，到此次英法苏谈判就最后破产。」</p>
      </div>
    </div>

    <div class="part">
      <div class="part-head red"><span class="part-no">五</span><span class="part-title">中国的算式：为什么此刻最怕的不是正面进攻，是「东方慕尼黑」</span><span class="part-scope">1939 夏</span></div>
      <div class="part-body">
        <p>第三问落到日本。这里有一段极不客气的判断：「目前和英国妥协的趋势甚大。英国反动派将以共同瓜分中国和在财政上经济上帮助日本为条件，换得日本充当英国利益的东方警犬，镇压中国的民族解放运动，牵制苏联。」</p>
        <p>这话在当时有具体所指：一九三九年六月起日军封锁天津英租界，英日谈判数月，七月二十四日签订《有田—克莱琪协定》，英国承认日本在华造成的「实际局势」。<b>这就是本篇反复说的「东方慕尼黑」</b>——不是抽象的担心，而是一份刚签了字的文件。</p>
        <p>于是全篇最要紧的一组判断出来了：日本受苏德协定打击，「对中国正面大规模军事进攻的可能性，或者不很大了」，但会「更厉害地进行其『以华制华』的政治进攻和『以战养战』的经济侵略」，在占领区「继续疯狂的军事『扫荡』」，并「想经过英国压迫中国投降」。<b>正面松一口气的地方，正是敌后紧起来的地方</b>——这句话在当时看是预测，在后来看是抗战相持阶段的常态。</p>
      </div>
    </div>

    <div class="part">
      <div class="part-head gold"><span class="part-no">六</span><span class="part-title">它先给党报读者上国际课，十五天后再给国统区记者上国内课</span><span class="part-scope">1939.09.01 ／ 09.16</span></div>
      <div class="part-body">
        <p>本篇的读者是《新华日报》记者，但首发在延安《新中华报》。九月十六日，中央社记者刘尊棋、《扫荡报》记者耿坚白、《新民报》记者张西洛到延安，见面第一句就是「今天在《新中华报》上看了毛先生九月一日的谈话」，随即追问：<b>相持阶段到底到了没有？</b>毛泽东答得比本篇更谨慎：「相持阶段是<b>有条件地</b>到来了。」</p>
        <p>据张西洛后来在《人民日报》（1994 年 1 月 2 日）的回忆，那次会见在延安新市区边区政府交际处的窑洞里，桌上摆着清茶、瓜子和延安生产的香烟，柯庆施、肖向荣、向仲华、《新中华报》的李初梨在座，另有两位青年记录，窑洞里挤了十七八个人。<b>谈话记录由三记者自行整理，寄给重庆国际新闻社</b>；延安《新中华报》10 月 6 日头版整版刊出，重庆《新华日报》10 月 19 日刊出，中央社、《扫荡报》、《新民报》则一字未提。<b>同一套传播路径，一个月里跑了三趟：先党内、再延安、再国统区。</b></p>
      </div>
    </div>

    <div class="sec-head" style="margin-top:34px;"><span class="sec-no" style="font-size:16px;">时间轴</span><span class="sec-title" style="font-size:17px;">从慕尼黑到华沙：两年，和三十天</span></div>
    <div class="timeline">
      <div class="tl-item"><div class="tl-date">1938.09.29</div><div class="tl-body">英法德意签署《慕尼黑协定》，捷克被迫割让苏台德区——本篇所说「不干涉」政策的顶点</div></div>
      <div class="tl-item"><div class="tl-date">1939.03.15</div><div class="tl-body">德军进入布拉格，完全占领捷克斯洛伐克；慕尼黑协定签字未满半年即被撕毁</div></div>
      <div class="tl-item"><div class="tl-date">1939.04.15</div><div class="tl-body">英法苏三国谈判在莫斯科开始——本篇给出的起点日期</div></div>
      <div class="tl-item"><div class="tl-date">1939.05—06</div><div class="tl-body">日军封锁天津英租界，英日谈判开场；国民党五届五中全会后《限制异党活动办法》在各地推行，平江惨案（6.12）发生</div></div>
      <div class="tl-item"><div class="tl-date">1939.07.24</div><div class="tl-body">英日签订《有田—克莱琪协定》，英国承认日本在华「实际局势」——「东方慕尼黑」的具体所指</div></div>
      <div class="tl-item gold"><div class="tl-date">1939.08.23</div><div class="tl-body"><b>《苏德互不侵犯条约》在莫斯科签字</b>；同日英法苏谈判破裂，三国谈判共历四个多月，本篇给出的终点日期</div></div>
      <div class="tl-item"><div class="tl-date">1939.09.01</div><div class="tl-body"><b>德军入侵波兰（柏林时间 4:45）；同日毛泽东对《新华日报》记者发表本篇谈话</b></div></div>
      <div class="tl-item"><div class="tl-date">1939.09.03</div><div class="tl-body">英法对德宣战——本篇「两大帝国主义集团直接冲突」的判断在两天后兑现</div></div>
      <div class="tl-item"><div class="tl-date">1939.09.05 前后</div><div class="tl-body">延安《新中华报》刊出本篇（确切日期未核实；9.16 三记者已在报上读到）</div></div>
      <div class="tl-item blue"><div class="tl-date">1939.09.16</div><div class="tl-body">中央社、《扫荡报》、《新民报》三记者在延安访问毛泽东，开口即问「相持阶段是否到来」——下一篇</div></div>
      <div class="tl-item"><div class="tl-date">1939.09.17</div><div class="tl-body">苏军从东面进入波兰——本篇写下「共产党决不赞助任何掠夺战争」之后十六天</div></div>
      <div class="tl-item"><div class="tl-date">1939.09.28</div><div class="tl-body">华沙投降；德苏按秘密议定书瓜分波兰。同日毛泽东发表《苏联利益和人类利益的一致》</div></div>
    </div>
  </section>

  <!-- 3 核心论点 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">叁</span><span class="sec-title">核心论点</span></div>
    <div class="thesis">
      <span class="q">一句话：</span>苏德协定不是战争的起因，而是「不干涉」政策破产的证明——欧洲从此进入全面战争；日本受此打击、转而依赖「以华制华」，于是中国<b>战略退却结束、相持阶段开始</b>，全国的任务从「熬过去」换成<b>「准备反攻」</b>。
    </div>

    <div class="cards">
      <div class="card">
        <h4>一 · 先把因果的方向掰正<span class="card-tag">第一、二问</span></h4>
        <p>题目不是「苏德协定为什么签」，而是「英法苏谈判为什么破裂」。作者把流行的因果倒过来：<b>是谈判破裂导致协定，不是协定导致谈判破裂</b>，理由是一份可核对的行为清单——不平等互惠、不保证波罗的海、不给过境权。因果方向一改，责任归属随之改变。</p>
      </div>
      <div class="card gold">
        <h4>二 · 用「集团」而不是「国家」看世界<span class="card-tag">第三问</span></h4>
        <p>德意集团、英法集团、以美国为首的第三集团（「暂时还不至于转入战争」），再加「整个资本主义世界之外」的苏联。四个格子一摆，任何一国的动作都可以被读成集团的动作；中国的处境则被读成<b>日本受挫之后的压力转移</b>，而不是孤立的中日问题。</p>
      </div>
      <div class="card green">
        <h4>三 · 宣布一次阶段交接<span class="card-tag">第四问</span></h4>
        <p>「我国的战略退却阶段便已完结，而战略相持阶段便已到来。所谓战略相持阶段，即是准备反攻的阶段。」——这是《论持久战》三阶段预言第一次被宣布为现实，也是全篇最重的政治宣示。<b>但它同时加了两个限制</b>：正面与敌后成反比，敌后会更紧；国力差距仍远，反攻要靠全国一致。</p>
      </div>
      <div class="card blue">
        <h4>四 · 一条容易被跳过的原则句<span class="card-tag">第三问</span></h4>
        <p>「世界上只有非掠夺性的谋解放的战争，才是正义的战争。共产党决不赞助任何掠夺战争。」全篇唯一一条不针对具体国家的判断，也是唯一一条在此后两周内就要被事实对照的判断。读本篇时，它最短，也最重。</p>
      </div>
    </div>
  </section>

  <!-- 4 分析框架 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">肆</span><span class="sec-title">分析框架</span></div>
    <div class="chain">
      <div class="node"><div class="n-label">协定</div><div class="n-sub">苏德互不侵犯条约<br>8.23 · 十年为期</div></div>
      <div class="arrow">→</div>
      <div class="node gold"><div class="n-label">破裂</div><div class="n-sub">英法苏谈判 4.15—8.23<br>卡在互惠／波罗的海／过境权</div></div>
      <div class="arrow">→</div>
      <div class="node"><div class="n-label">破产</div><div class="n-sub">「不干涉」政策<br>从慕尼黑顶点到最后破产</div></div>
    </div>
    <div class="chain" style="margin-top:8px;">
      <div class="node blue"><div class="n-label">转向</div><div class="n-sub">两大集团直接冲突<br>第二次帝国主义战争进新阶段</div></div>
      <div class="arrow">→</div>
      <div class="node"><div class="n-label">受压</div><div class="n-sub">日本受挫 · 外交两派<br>对英妥协＝东方慕尼黑</div></div>
      <div class="arrow">→</div>
      <div class="node green"><div class="n-label">换打法</div><div class="n-sub">以华制华 · 以战养战<br>敌后「扫荡」加紧</div></div>
    </div>
    <div class="chain" style="margin-top:8px;">
      <div class="node gold"><div class="n-label">交接</div><div class="n-sub">退却结束 · 相持开始<br>相持＝准备反攻</div></div>
      <div class="arrow">→</div>
      <div class="node"><div class="n-label">三立场</div><div class="n-sub">抗战／团结／进步<br>各配一个「反对」</div></div>
      <div class="arrow">→</div>
      <div class="node"><div class="n-label">总任务</div><div class="n-sub">准备反攻<br>正面防御＋敌后战争＋改革</div></div>
    </div>
    <p class="lead" style="margin-top:16px;">这条链的形状值得注意：<b>它从「别人家的战争」一路推到「我们今天的任务」，中间没有一步是跳到结论的</b>。五个环节里，前三个讲欧洲，第四个讲日本，第五个才讲中国——而且中国的结论不是「欧洲打仗对我们有利」这种便宜的判断，而是「压力会换个方向来」。<b>把好消息读成压力的转移，是这篇最容易被低估的技术。</b></p>
  </section>

  <!-- 5 篇章结构 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">伍</span><span class="sec-title">篇章结构</span></div>
    <p class="lead">四问四答，长度极不平均。<b>问的人只递问题，答的人控制节奏</b>——这是谈话体最实用的一课：问题由对方设定，重量由自己分配。</p>
    <table class="plain">
      <thead><tr><th class="c1">位置</th><th>问的是什么</th><th>答案的骨架</th><th style="width:64px;">汉字</th></tr></thead>
      <tbody>
        <tr><td class="c1">第一问</td><td>苏德协定的意义如何？</td><td>一句定性（苏联力量增长＋坚持和平的结果）＋四个「打破／巩固／保障」＋东方效果（打击日本、援助中国）＋一句「全部政治意义」</td><td>205</td></tr>
        <tr><td class="c1">第二问</td><td>英法苏谈判为什么没成功？</td><td>纠正因果 → 「不干涉」政策的定义与目的 → 四年失地清单 → 三条破裂症结 → 张伯伦的结局：「以损人的目的开始，以害己的结果告终」</td><td>694</td></tr>
        <tr><td class="c1">第三问</td><td>目前时局将如何发展？</td><td>欧洲（两大集团／正义与非正义）→ 社会民主党分化 → 美国第三集团 → 日本两派与东方慕尼黑 → 苏联 → 「这些就是我对于国际形势的估计」</td><td>1242</td></tr>
        <tr><td class="c1">第四问</td><td>中国的前途将如何？</td><td>两个前途 → 相持阶段到来 → 正面与敌后成反比 → 三个立场（抗战／团结／进步）→ 总任务：准备反攻</td><td>775</td></tr>
      </tbody>
    </table>
    <p class="lead" style="margin-top:12px;">四块的字数比是 <b>1 : 3.4 : 6 : 3.8</b>。最短的一块是「定性」，最长的一块是「推演」，最后一块是「结论」——<b>结论只有推演的三分之二长，而且是唯一一块带编号（第一、第二、第三）的</b>。文件化的只有要求，分析永远比要求长。</p>

    <div class="sec-head" style="margin-top:30px;"><span class="sec-no" style="font-size:16px;">光谱</span><span class="sec-title" style="font-size:17px;">一九三九年九月，世界被分成四格</span></div>
    <div class="spectrum">
      <div class="spec-frame">
        <div class="spec-band">
          <div class="spec-seg red">德意集团</div>
          <div class="spec-seg gold">英法集团</div>
          <div class="spec-seg blue">美国集团</div>
          <div class="spec-seg green">苏联</div>
        </div>
        <div class="spec-labels">
          <div class="spec-label"><b>掠夺者</b>要打仗，为争夺波兰、巴尔干、地中海</div>
          <div class="spec-label"><b>纵容者</b>「不干涉」破产，被迫直接上场</div>
          <div class="spec-label"><b>观望者</b>中立之名，待机争领导地位</div>
          <div class="spec-label"><b>光明世界</b>「资本主义世界之外」</div>
        </div>
      </div>
    </div>
    <p class="lead" style="margin-top:12px;">这个四格法有一个明确的不对称：<b>前三格是按「行为」分的（掠夺／纵容／观望），第四格是按「性质」分的（社会主义）</b>。同一张表里混用了两套标准，所以第四格不参与前三个的互相换算——它既是分析单位，也是立场宣示。<b>读到这里要停下来问一句：一张混用了两套标准的分类表，还能不能被证伪？</b></p>

    <div class="sec-head" style="margin-top:30px;"><span class="sec-no" style="font-size:16px;">对照</span><span class="sec-title" style="font-size:17px;">同一场战争，两种读法</span></div>
    <div class="move-grid">
      <div class="move">
        <div class="move-head"><span class="move-no">正义</span><span class="move-tag">非掠夺性 · 谋解放</span></div>
        <div class="move-text">「世界上只有非掠夺性的谋解放的战争，才是正义的战争。」</div>
        <div class="move-note">判据是<b>战争的目的</b>，不是谁先开枪、谁签了条约、谁是盟友。</div>
      </div>
      <div class="move gold">
        <div class="move-head"><span class="move-no">非正义</span><span class="move-tag">掠夺性 · 争统治权</span></div>
        <div class="move-text">「双方的目的都是帝国主义的目的，都是为了争夺对殖民地半殖民地和势力范围的统治权。」</div>
        <div class="move-note">判据同样是<b>目的</b>。所以两大集团「都将不顾羞耻地宣称自己是正义的」，而两种宣称都不作数。</div>
      </div>
      <div class="move blue">
        <div class="move-head"><span class="move-no">例外</span><span class="move-tag">人民的位置</span></div>
        <div class="move-text">「人民如果不愿充当帝国主义的炮灰，他们就一定会起来用各种方式去反对帝国主义战争。」</div>
        <div class="move-note">战争的性质由政府决定，反战的力量由人民决定——两句话之间，留出了「人民阵线」这个位置。</div>
      </div>
    </div>
  </section>

  <!-- 6 精读感悟 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">陆</span><span class="sec-title">精读感悟</span></div>
    <div class="obs">

      <div class="obs-item">
        <div class="obs-num">1</div>
        <div class="obs-body">
          <h4>它不预测谁赢，它换算「压力会落到谁头上」</h4>
          <p>全篇没有一句「苏联会赢」或「德国会败」。它做的事情是：把「日本受了打击」换算成「日本的外交会更依赖对英妥协」，再把「对英妥协」换算成「逼中国投降的东方慕尼黑」，最后把「正面打不动」换算成「敌后会更紧」。</p>
          <p>所以同一段里能同时出现两句看似矛盾的话——「对中国正面大规模军事进攻的可能性，或者不很大了」，和「在其占领地则将继续疯狂的军事『扫荡』」。<b>这不是前后不一致，这是同一个约束的两面</b>：资源不够打正面，就转到政治进攻、经济掠夺和敌后清剿上去。</p>
          <span class="mv">迁移：读任何外部大变动（行业政策、平台规则、汇率、战争），别急着判断「谁赢」；先问三句——<b>它改变了谁的约束条件？那个人下一步最省力的动作是什么？那个动作会落在谁身上？</b>第三问的答案通常不是发出消息的那一方。</span>
        </div>
      </div>

      <div class="obs-item">
        <div class="obs-num">2</div>
        <div class="obs-body">
          <h4>「准」和「全」是两件事，这一篇正好可以拆开看</h4>
          <p>本篇署日在开战当天，通篇却写「迫在眉睫」；两天后英法宣战，判断兑现得极快。但它写进推理的变量只有三个：英法有没有诚意、波罗的海保不保、过境权给不给。没写进去的，是那份秘密议定书——而正是那份议定书，决定了十七天后苏军从东面进入波兰。</p>
          <p><b>于是出现了两个不同的评价维度</b>：就「短期走势」而言，这篇准得惊人；就「信息完整性」而言，它是在一份被删节的档案上做的推演。而这两件事在阅读中经常被混为一谈：一句判断兑现了，读者就会连带相信它的全部前提。</p>
          <span class="mv">迁移：给任何一份分析做两栏笔记——<b>左栏写「它预测了什么、后来对不对」，右栏写「它用了哪几个变量、缺了哪几个」</b>。左栏决定你要不要继续读这个人，右栏决定你要不要用这套方法。多数人被左栏说服，然后在右栏上吃亏。</span>
        </div>
      </div>

      <div class="obs-item">
        <div class="obs-num">3</div>
        <div class="obs-body">
          <h4>写下原则句的那一刻，也就留下了被对照的位置</h4>
          <p>第三问里那句「共产党决不赞助任何掠夺战争」，是全篇最干净的一句。十六天后，苏军进入波兰东部；二十七天后，德苏按秘密议定书瓜分波兰。此后半个世纪，这件事在不同阵营里被反复引用，用来证明两种完全相反的结论。</p>
          <p>这里不必替文本辩护，也不必用后见之明去否定 1939 年 9 月延安的处境——那时英法苏谈判刚刚破裂，苏联要单独面对德国，这是真实的困境。<b>值得记下的只是一点：这篇文本选择公开为苏联的行为框架做解释，而解释的方式是把标准收在「目的」上；一旦标准收在目的上，判断某一方的行为是否「掠夺」，就要由解释者来认定。</b>标准越抽象，解释权越集中。</p>
          <span class="mv">迁移：当一个框架必须为「我方某个具体行为」作解释时，检验它只需一道题——<b>把同一把尺子拿去量对手的同类行为，得到的结论是否对称？</b>对称，框架还活着；不对称，它已经从分析工具变成了立场工具。这道题对任何立场都成立，包括你认同的那一个。</span>
        </div>
      </div>

    </div>
  </section>

  <!-- 7 金句 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">柒</span><span class="sec-title">金句摘录</span></div>
    <div class="golden">
      <div class="golden-item">
        <div class="text">人们还不明了苏德互不侵犯协定是英法苏谈判破裂的结果，反而以为英法苏谈判的破裂是苏德协定的结果。</div>
        <div class="ctx">第二问 · 1991 年版 580—581 页 · 全篇的第一个动作：不是预测，是纠正因果的方向</div>
      </div>
      <div class="golden-item">
        <div class="text">英法苏三国谈判所以没有成功，完全由于英法政府没有诚意。</div>
        <div class="ctx">第二问 · 1991 年版 581 页 · 紧接着的三条症结（互惠／波罗的海／过境权）是这句话的证据</div>
      </div>
      <div class="golden-item">
        <div class="text">张伯伦以损人的目的开始，以害己的结果告终。这将是一切反动政策的发展规律。</div>
        <div class="ctx">第二问末 · 引作者本人 1938 年 10 月在六届六中全会上说过的话「搬起石头打自己的脚」，形成一次文内自引</div>
      </div>
      <div class="golden-item">
        <div class="text">世界上只有非掠夺性的谋解放的战争，才是正义的战争。共产党决不赞助任何掠夺战争。</div>
        <div class="ctx">第三问 · 全篇唯一一条不针对具体国家的判断，也是十六天后就要被事实对照的一句</div>
      </div>
      <div class="golden-item">
        <div class="text">但是，正面相持和敌后相持是成反比例的，正面相持的局面出现，敌后斗争的局面就要紧张。</div>
        <div class="ctx">第四问 · 1991 年版 584 页 · 全篇最实用的一句军事判断：好消息出现的位置，就是压力转移的位置</div>
      </div>
      <div class="golden-item">
        <div class="text">从现时起，全国应以「准备反攻」为抗战的总任务。</div>
        <div class="ctx">第四问末 · 1991 年版 586 页 · 全篇最后一句之前的那一句，把一个阶段的判断变成一个可执行的任务名</div>
      </div>
    </div>
    <p class="lead" style="margin-top:14px;">以上均为 1991 年版文字，已逐字核对。引文中「」为本书统一体例所加。原刊与选集本之间另有若干文字差异（如「苏德互不侵犯协定」在原刊本中作「德苏互不侵犯协定」），<b>此处不展开</b>：这些差异见于竹内实《毛泽东集》的校勘表，本笔记未逐条复核原件，故只记其存在，不作引证。</p>
  </section>

  <!-- 8 延伸阅读 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">捌</span><span class="sec-title">延伸阅读</span></div>
    <div class="next">
      <div class="next-card">
        <h4>下一篇预告</h4>
        <div class="t">《和中央社、扫荡报、新民报三记者的谈话》<br><span style="font-size:13px;color:var(--ink-3);font-weight:400;">1939.09.16 ｜ 第二卷第十八篇 ｜ 1991 年版第 587 页起</span></div>
        <p>十五天后，三家国统区媒体的记者坐到延安的窑洞里，开口第一句就是「今天在《新中华报》上看了毛先生九月一日的谈话」——<b>本篇是那篇的提问来源</b>。那篇追问的是国内：相持阶段是否真的到来、边区该不该取消、磨擦怎么办，并留下「人不犯我，我不犯人；人若犯我，我必犯人」。</p>
      </div>
      <div class="next-card">
        <h4>对照阅读</h4>
        <div class="t">《苏联利益和人类利益的一致》<br><span style="font-size:13px;color:var(--ink-3);font-weight:400;">1939.09.28 ｜ 第二卷第十九篇 ｜ 1991 年版第 593 页起</span></div>
        <p>同一个月里，苏军已进入波兰、华沙已投降。<b>本篇说「决不赞助任何掠夺战争」，那一篇要回答的是「苏军进入波兰算不算掠夺」</b>。两篇相隔二十七天，处理的是同一个难题的两面：先给苏联的行为划定解释框架，再把这个框架用到最难解释的那件事上。三篇并读，可以看清 1939 年 9 月这一个月里，延安是怎样同时应对「国际变局」「国内追问」「盟友行为」三件事的。</p>
      </div>
    </div>
  </section>

  <!-- 9 今日思考题 -->
  <section class="section">
    <div class="sec-head"><span class="sec-no">玖</span><span class="sec-title">今日思考题</span></div>
    <div class="think">
      <h4>把历史方法论迁移到今天的场景</h4>
      <div class="q">一 · <b>换算法题</b>：挑一条你本周看到的重大消息（并购、禁令、裁员、加息）。不许判断「谁赢」，只填三格：<b>它改变了谁的约束条件 → 那个人下一步最省力的动作 → 那个动作落在谁头上。</b>填完再回头看新闻标题，你会发现标题写的是第一格，风险在第三格。</div>
      <div class="q">二 · <b>两栏题</b>：找一份你信任的分析（研报、长文、内部判断），画两栏。左栏：<b>它预测了什么，后来对不对。</b>右栏：<b>它用了哪几个变量，缺了哪几个，缺的那个会不会改变结论。</b>然后做一个决定：你是继续听这个人，还是只借用他的方法？</div>
      <div class="q">三 · <b>尺子题</b>：写下你所在团队或行业最常讲的一条原则（客户第一、长期主义、不裁员、透明）。然后找一件「我方做过、与这条原则不太一致」的具体事，<b>用同一把尺子去量它，再量一次竞争对手的同类事</b>。两次结论对称吗？不对称的地方，就是原则实际生效的边界。</div>
      <div class="q">四 · <b>阶段题</b>：本篇宣布「退却结束、相持开始」，同时立刻补一句「敌后会更紧」。回看你自己正在做的事：<b>如果大环境从「退」转成「相持」，你所在的位置会更松还是更紧？</b>把答案写成一句可核对的话（例如「正面获客变容易，但留存成本上升」），三个月后回来对照。</div>
      <div class="hint"><b>三问卡</b>：① 这条消息改变的到底是谁的约束条件？② 这份分析用了哪几个变量，缺的那一个要紧吗？③ 我手上这把尺子，量对手时还对称吗？<b>第一问决定你会不会误判风险的方向，第三问决定你会不会误判自己的位置。</b></div>
    </div>
  </section>
